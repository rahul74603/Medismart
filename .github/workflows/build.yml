name: Build APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.x
          channel: stable

      - name: Setup keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=/tmp/keystore.jks
          EOF

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Customer APK
        run: flutter build apk --release --split-per-abi

      - name: Rename Customer APKs
        run: |
          mkdir -p output
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk output/MediSmart-Customer-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk output/MediSmart-Customer-armeabi.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk output/MediSmart-Customer-x86_64.apk

      - name: Build Owner APK
        run: flutter build apk --release --split-per-abi --dart-define=OWNER_TOOL=true

      - name: Rename Owner APKs
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk output/MediSmart-Owner-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk output/MediSmart-Owner-armeabi.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk output/MediSmart-Owner-x86_64.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: MediSmart-APKs
          path: output/
          retention-days: 30