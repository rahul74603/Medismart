name: medismart_ui
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.6
  font_awesome_flutter: ^10.7.0
  google_fonts: ^6.1.0

  # Database & Logic
  sqflite: ^2.3.0
  path: ^1.9.0
  intl: ^0.19.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2

  # Security & Device ID
  device_info_plus: ^10.1.0
  crypto: ^3.0.3

  # PDF, Printing & Sharing
  pdf: ^3.10.8
  printing: ^5.12.0
  share_plus: ^7.2.1
  open_file: ^3.3.2

  # Charts / Graphs
  fl_chart: ^0.63.0

  # QR Scan (camera)
  mobile_scanner: ^5.2.3
  http: ^1.2.0  # Gemini AI calls
  permission_handler: ^11.3.0  # SMS permission

  # Call & SMS (New Added)
  url_launcher: ^6.2.4
  file_picker: ^10.3.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  # assets:
  #   - assets/

# --- APP ICON SETTINGS ---
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21